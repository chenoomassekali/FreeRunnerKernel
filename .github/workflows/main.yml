name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix KernelSU
        run: |
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git rm --cached KernelSU 2>/dev/null || true
          sed -i '/kernelsu/Id' drivers/Makefile
          sed -i '/kernelsu/Id' drivers/Kconfig
          sed -i '/KernelSU/Id' drivers/Makefile
          sed -i '/KernelSU/Id' drivers/Kconfig

      - name: Fix CPU Scheduler Conflict
        run: |
          rm -f kernel/sched/cpufreq_nobody_sched.c 2>/dev/null || true
          sed -i '/cpufreq_nobody_sched/d' kernel/sched/Makefile

      - name: Fix DWC3 Conflict
        run: |
          sed -i 's/dwc3_thread_interrupt/dwc3_interrupt/g' drivers/usb/dwc3/gadget.c 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc flex bison libssl-dev libelf-dev python3 wget clang lld llvm binutils-aarch64-linux-gnu

      - name: Download Nethunter boot.img
        run: |
          wget -q https://github.com/chenoomassekali/android_kernel_Samsung_Exynos9825_d2s/releases/download/v2.0/boot-current.img -O nethunter-boot.img
          ls -lh nethunter-boot.img

      - name: Add RT2800 Config
        run: |
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT2770=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT3070=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' arch/arm64/configs/exynos9820-d2s_defconfig

      - name: Apply WiFi Signal Boost Patches
        run: |
          DEFCONFIG=arch/arm64/configs/exynos9820-d2s_defconfig

          sed -i 's/CONFIG_CFG80211_DEFAULT_PS=y/# CONFIG_CFG80211_DEFAULT_PS is not set/' $DEFCONFIG
          sed -i 's/# CONFIG_MAC80211_RC_MINSTREL_VHT is not set/CONFIG_MAC80211_RC_MINSTREL_VHT=y/' $DEFCONFIG
          sed -i 's/# CONFIG_WLAN_BCM4375_ENHANCED_FEATURES is not set/CONFIG_WLAN_BCM4375_ENHANCED_FEATURES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_WLAN_BCM4375_ADVANCED_FEATURES is not set/CONFIG_WLAN_BCM4375_ADVANCED_FEATURES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_BCMDHD_PREALLOC_PKTIDMAP is not set/CONFIG_BCMDHD_PREALLOC_PKTIDMAP=y/' $DEFCONFIG
          sed -i 's/# CONFIG_WLAN_TSQ_MULTIPLIER is not set/CONFIG_WLAN_TSQ_MULTIPLIER=y/' $DEFCONFIG
          sed -i 's/# CONFIG_WLAN_ANQP_RMAC_BACKPORTED is not set/CONFIG_WLAN_ANQP_RMAC_BACKPORTED=y/' $DEFCONFIG

          echo "=== WiFi Patch Verification ==="
          grep -E "CFG80211_DEFAULT_PS|MINSTREL_VHT|BCM4375|PKTIDMAP|TSQ|ANQP" $DEFCONFIG

      - name: Build Kernel with Clang
        id: build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export ANDROID_MAJOR_VERSION=q
          rm -rf out
          mkdir -p out
          make O=out exynos9820-d2s_defconfig
          make O=out -j$(nproc) KCFLAGS="-w -Wno-error" 2>&1 || true
          KERNEL=$(find out -name "Image" | grep -v "Image.gz" | head -1)
          if [ -z "$KERNEL" ]; then
            KERNEL=$(find out -name "Image.gz" | head -1)
          fi
          echo "Kernel: $KERNEL"
          ls -lh "$KERNEL"
          echo "kernel_path=$KERNEL" >> $GITHUB_OUTPUT

      - name: Unpack and Repack boot.img (Pure Python)
        run: |
          python3 << 'EOF'
          import struct, os

          def read_file(path):
              with open(path, 'rb') as f:
                  return f.read()

          def write_file(path, data):
              with open(path, 'wb') as f:
                  f.write(data)

          def align(data, pagesize):
              r = len(data) % pagesize
              if r == 0:
                  return data
              return data + b'\x00' * (pagesize - r)

          boot = read_file('nethunter-boot.img')
          assert boot[:8] == b'ANDROID!', "Not an Android boot image!"

          (kernel_size, kernel_addr,
           ramdisk_size, ramdisk_addr,
           second_size, second_addr,
           tags_addr, page_size) = struct.unpack_from('<8I', boot, 8)

          os_version_patch = struct.unpack_from('<I', boot, 40)[0]
          name    = boot[48:64]
          cmdline = boot[64:576]
          id_data = boot[576:608]

          print(f"page_size    = {page_size}")
          print(f"kernel_size  = {kernel_size}")
          print(f"ramdisk_size = {ramdisk_size}")
          print(f"kernel_addr  = 0x{kernel_addr:08x}")
          print(f"ramdisk_addr = 0x{ramdisk_addr:08x}")
          print(f"tags_addr    = 0x{tags_addr:08x}")

          def ceil_page(n, ps):
              return ((n + ps - 1) // ps) * ps

          off_kernel  = page_size
          off_ramdisk = off_kernel  + ceil_page(kernel_size,  page_size)
          off_second  = off_ramdisk + ceil_page(ramdisk_size, page_size)

          ramdisk_data = boot[off_ramdisk : off_ramdisk + ramdisk_size]
          second_data  = boot[off_second  : off_second  + second_size] if second_size else b''

          print(f"Extracted ramdisk: {len(ramdisk_data)} bytes")

          kernel_path = os.environ.get('KERNEL_PATH', '')
          assert kernel_path and os.path.exists(kernel_path), f"Kernel not found: {kernel_path}"
          kernel_data = read_file(kernel_path)
          print(f"New kernel: {len(kernel_data)} bytes")

          def encode_os_version(ver_str, patch_str):
              a, b, c = map(int, ver_str.split('.'))
              ver = ((a & 0x7f) << 25) | ((b & 0x7f) << 18) | ((c & 0x7f) << 11)
              y, m = map(int, patch_str.split('-'))
              patch = ((y - 2000) << 4) | m
              return (ver | patch)

          os_ver = encode_os_version("16.0.0", "2026-03")

          hdr  = b'ANDROID!'
          hdr += struct.pack('<8I',
                             len(kernel_data),  kernel_addr,
                             len(ramdisk_data), ramdisk_addr,
                             len(second_data),  second_addr,
                             tags_addr,         page_size)
          hdr += struct.pack('<I', os_ver)
          hdr += struct.pack('<I', 1)
          hdr += name
          hdr += cmdline
          hdr += id_data
          pad_len = page_size - (len(hdr) % page_size)
          if pad_len != page_size:
              hdr += b'\x00' * pad_len

          output  = hdr
          output += align(kernel_data,  page_size)
          output += align(ramdisk_data, page_size)
          if second_data:
              output += align(second_data, page_size)

          write_file('boot-wifi-boost-d2s.img', output)
          print(f"boot.img written: {len(output)} bytes")
          EOF

        env:
          KERNEL_PATH: ${{ steps.build.outputs.kernel_path }}

      - name: Verify boot.img
        run: |
          ls -lh boot-wifi-boost-d2s.img
          python3 -c "
          import struct
          with open('boot-wifi-boost-d2s.img','rb') as f: h=f.read(64)
          assert h[:8]==b'ANDROID!', 'Bad magic!'
          ks,ka,rs,ra,ss,sa,ta,ps = struct.unpack_from('<8I',h,8)
          print(f'kernel_size={ks}, ramdisk_size={rs}, page_size={ps}')
          print('boot.img looks valid!')
          "

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-wifi-boost-d2s
          path: boot-wifi-boost-d2s.img
