name: Build Kernel RT2770

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc flex bison libssl-dev libelf-dev python3 wget git clang lld llvm device-tree-compiler
          clang --version
          ld.lld --version

      - name: Download Nethunter boot.img
        run: |
          wget -q https://github.com/chenoomassekali/android_kernel_Samsung_Exynos9825_d2s/releases/download/v2.0/boot-current.img -O nethunter-boot.img
          ls -lh nethunter-boot.img

      - name: Fix All Build Issues
        run: |
          sed -i 's/-Werror//g' scripts/dtc/Makefile 2>/dev/null || true
          sed -i 's/HOSTCFLAGS := -Wall -Wstrict-prototypes/HOSTCFLAGS := -Wall -Wno-error/g' scripts/Makefile 2>/dev/null || true
          # Hapus semua flag polly dan mllvm
          find . \( -name "Makefile" -o -name "Kbuild" \) | xargs sed -i \
            -e 's/-mllvm -polly-vectorizer=stripmine//g' \
            -e 's/-mllvm -polly-invariant-load-hoisting//g' \
            -e 's/-mllvm -polly[^ ]*//g' \
            -e 's/-mllvm//g' \
            -e 's/-fpolly[^ ]*//g' \
            -e 's/--pack-dyn-relocs=relr//g' \
            2>/dev/null || true
          python3 << 'PYEOF'
          import os, glob, re
          # Fix __has_attribute
          for fpath in glob.glob('include/linux/compiler*.h'):
              try:
                  with open(fpath, 'r') as f:
                      content = f.read()
                  original = content
                  content = re.sub(r'__has_attribute\s*\([^)]+\)', '0', content)
                  if content != original:
                      with open(fpath, 'w') as f:
                          f.write(content)
                      print(f"Fixed: {fpath}")
              except Exception as e:
                  print(f"Skip {fpath}: {e}")
          # Fix duplicate static di tcp_ipv6.c
          try:
              with open('net/ipv6/tcp_ipv6.c', 'r') as f:
                  content = f.read()
              fixed = re.sub(r'\bstatic\s+static\b', 'static', content)
              if fixed != content:
                  with open('net/ipv6/tcp_ipv6.c', 'w') as f:
                      f.write(fixed)
                  print("Fixed: net/ipv6/tcp_ipv6.c")
          except Exception as e:
              print(f"Skip tcp_ipv6.c: {e}")
          PYEOF
          sed -i '146s/^static //' net/ipv6/tcp_ipv6.c 2>/dev/null || true
          echo "All fixes applied"

      - name: Add RT2770 and Encryption Config
        run: |
          DEFCONFIG=arch/arm64/configs/exynos9820-d2s_defconfig

          # =====================
          # RT2770 WiFi (fokus utama)
          # =====================
          echo "CONFIG_WLAN_VENDOR_RALINK=y"        >> $DEFCONFIG
          echo "CONFIG_RT2X00=y"                    >> $DEFCONFIG
          echo "CONFIG_RT2X00USB=y"                 >> $DEFCONFIG
          echo "CONFIG_RT2X00LIB=y"                 >> $DEFCONFIG
          echo "CONFIG_RT2X00LIB_USB=y"             >> $DEFCONFIG
          echo "CONFIG_RT2800USB=y"                 >> $DEFCONFIG
          echo "CONFIG_RT2800USB_RT2770=y"          >> $DEFCONFIG   # <-- TARGET UTAMA RT2770
          echo "CONFIG_RT2800LIB=y"                 >> $DEFCONFIG
          echo "CONFIG_RT2800USB_UNKNOWN=y"         >> $DEFCONFIG   # fallback chipset tak dikenal

          # Chipset lain dalam keluarga RT28xx (opsional, bisa dihapus jika tidak perlu)
          # echo "CONFIG_RT2800USB_RT3070=y"        >> $DEFCONFIG
          # echo "CONFIG_RT2800USB_RT3573=y"        >> $DEFCONFIG
          # echo "CONFIG_RT2800USB_RT53XX=y"        >> $DEFCONFIG
          # echo "CONFIG_RT2800USB_RT55XX=y"        >> $DEFCONFIG

          # =====================
          # Encryption - wajib agar data partition bisa mount
          # =====================
          echo "CONFIG_BLK_INLINE_ENCRYPTION=y"          >> $DEFCONFIG
          echo "CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK=y" >> $DEFCONFIG
          echo "CONFIG_EXT4_ENCRYPTION=y"                >> $DEFCONFIG
          echo "CONFIG_EXT4_FS_ENCRYPTION=y"             >> $DEFCONFIG
          echo "CONFIG_F2FS_FS_ENCRYPTION=y"             >> $DEFCONFIG
          echo "CONFIG_FS_ENCRYPTION=y"                  >> $DEFCONFIG
          echo "CONFIG_FS_ENCRYPTION_ALGS=y"             >> $DEFCONFIG
          echo "CONFIG_FS_ENCRYPTION_INLINE_CRYPT=y"     >> $DEFCONFIG

          # Fix stackprotector
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' $DEFCONFIG
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y"         >> $DEFCONFIG

      - name: Build Kernel with Clang
        id: build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LDFLAGS=""
          export DTC=$(which dtc)
          rm -rf out
          mkdir -p out
          make O=out exynos9820-d2s_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/nethunter.config 2>/dev/null || true
          scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          scripts/config --file out/.config --enable CONFIG_CC_STACKPROTECTOR_NONE
          scripts/config --file out/.config --disable CONFIG_POLLY_CLANG 2>/dev/null || true
          make O=out olddefconfig
          make O=out DTC=$DTC -j$(nproc) \
            HOSTCFLAGS="-Wno-error" \
            KCFLAGS="-w -Wno-error" \
            LD=ld.lld \
            2>&1 | tee /tmp/build.log || true
          KERNEL=$(find out -name "Image" | grep -v "Image.gz" | head -1)
          if [ -z "$KERNEL" ]; then
            KERNEL=$(find out -name "Image.gz" | head -1)
          fi
          if [ -z "$KERNEL" ]; then
            echo "=== ERROR: Kernel not found. Errors ==="
            grep -i "error:" /tmp/build.log | grep -v "Wno-error" | tail -30
            exit 2
          fi
          echo "Kernel: $KERNEL"
          ls -lh "$KERNEL"
          echo "kernel_path=$KERNEL" >> $GITHUB_OUTPUT

      - name: Unpack and Repack boot.img (Pure Python)
        run: |
          python3 << 'EOF'
          import struct, os

          def read_file(path):
              with open(path, 'rb') as f:
                  return f.read()

          def write_file(path, data):
              with open(path, 'wb') as f:
                  f.write(data)

          def align(data, pagesize):
              r = len(data) % pagesize
              if r == 0:
                  return data
              return data + b'\x00' * (pagesize - r)

          boot = read_file('nethunter-boot.img')
          assert boot[:8] == b'ANDROID!', "Not an Android boot image!"

          (kernel_size, kernel_addr,
           ramdisk_size, ramdisk_addr,
           second_size, second_addr,
           tags_addr, page_size) = struct.unpack_from('<8I', boot, 8)

          os_version_patch = struct.unpack_from('<I', boot, 40)[0]
          name    = boot[48:64]
          cmdline = boot[64:576]
          id_data = boot[576:608]

          print(f"page_size    = {page_size}")
          print(f"kernel_size  = {kernel_size}")
          print(f"ramdisk_size = {ramdisk_size}")

          def ceil_page(n, ps):
              return ((n + ps - 1) // ps) * ps

          off_kernel  = page_size
          off_ramdisk = off_kernel  + ceil_page(kernel_size,  page_size)
          off_second  = off_ramdisk + ceil_page(ramdisk_size, page_size)

          ramdisk_data = boot[off_ramdisk : off_ramdisk + ramdisk_size]
          second_data  = boot[off_second  : off_second  + second_size] if second_size else b''

          print(f"Extracted ramdisk: {len(ramdisk_data)} bytes")

          kernel_path = os.environ.get('KERNEL_PATH', '')
          assert kernel_path and os.path.exists(kernel_path), f"Kernel not found: {kernel_path}"
          kernel_data = read_file(kernel_path)
          print(f"New kernel: {len(kernel_data)} bytes")

          def encode_os_version(ver_str, patch_str):
              a, b, c = map(int, ver_str.split('.'))
              ver = ((a & 0x7f) << 25) | ((b & 0x7f) << 18) | ((c & 0x7f) << 11)
              y, m = map(int, patch_str.split('-'))
              patch = ((y - 2000) << 4) | m
              return (ver | patch)

          os_ver = encode_os_version("16.0.0", "2026-03")

          hdr  = b'ANDROID!'
          hdr += struct.pack('<8I',
                             len(kernel_data),  kernel_addr,
                             len(ramdisk_data), ramdisk_addr,
                             len(second_data),  second_addr,
                             tags_addr,         page_size)
          hdr += struct.pack('<I', os_ver)
          hdr += struct.pack('<I', 1)
          hdr += name
          hdr += cmdline
          hdr += id_data
          pad_len = page_size - (len(hdr) % page_size)
          if pad_len != page_size:
              hdr += b'\x00' * pad_len

          output  = hdr
          output += align(kernel_data,  page_size)
          output += align(ramdisk_data, page_size)
          if second_data:
              output += align(second_data, page_size)

          # Output diberi nama sesuai chipset RT2770
          write_file('boot-rt2770-d2s.img', output)
          print(f"boot.img written: {len(output)} bytes")
          EOF

        env:
          KERNEL_PATH: ${{ steps.build.outputs.kernel_path }}

      - name: Verify boot.img
        run: |
          ls -lh boot-rt2770-d2s.img
          python3 -c "
          import struct
          with open('boot-rt2770-d2s.img','rb') as f: h=f.read(64)
          assert h[:8]==b'ANDROID!', 'Bad magic!'
          ks,ka,rs,ra,ss,sa,ta,ps = struct.unpack_from('<8I',h,8)
          print(f'kernel_size={ks}, ramdisk_size={rs}, page_size={ps}')
          print('boot.img looks valid!')
          "

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-rt2770-d2s
          path: boot-rt2770-d2s.img

